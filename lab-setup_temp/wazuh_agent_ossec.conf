<!-- Fragmentos modificados en /var/ossec/etc/ossec.conf de Debian -->

<!-- 1. Conexión con el servidor Wazuh -->
<client>
  <server>
    <address>192.168.221.120</address>
    <port>1514</port>
    <protocol>tcp</protocol>
  </server>
</client>

<!-- 2. Ingesta de Logs del Servidor Web para detectar ataques -->
<localfile>
  <log_format>apache</log_format>
  <location>/var/log/apache2/access.log</location>
</localfile>